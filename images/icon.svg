<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6CF0"/>
      <stop offset="1" stop-color="#3B2585"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#F5B400"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1A0F40" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Badge -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Solution tree -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M70 84 V178"/>
    <path d="M70 122 H98"/>
    <path d="M70 178 H98"/>
  </g>
  <rect x="48" y="50" width="70" height="40" rx="10" fill="#FFFFFF"/>
  <rect x="58" y="62" width="30" height="7" rx="3.5" fill="#5B3FB0"/>
  <rect x="104" y="106" width="96" height="32" rx="9" fill="#FFFFFF" opacity="0.92"/>
  <rect x="104" y="162" width="68" height="32" rx="9" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="120" cy="122" r="6" fill="#5B3FB0"/>
  <circle cx="120" cy="178" r="6" fill="#5B3FB0"/>

  <!-- Pilot arrow -->
  <g filter="url(#shadow)">
    <path d="M150 214 L222 146 L200 226 L184 200 Z" fill="url(#gold)"/>
    <path d="M222 146 L184 200" stroke="#B37F00" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
